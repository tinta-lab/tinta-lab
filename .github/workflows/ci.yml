name: CI

# Type-check, unit tests and production builds for all three apps, on
# GitHub-hosted runners. Runs on pull requests, and deploy.yml calls it before
# every production deploy, so a commit that fails here never reaches the
# server. Keep every job here on GitHub-hosted runners: pull_request runs code
# from forks, and the self-hosted runner IS the production server.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json
      # Unit tests only. The e2e suite needs a Postgres test DB
      # (DB_NAME=tinta_lab_test) and is not run here.
      - name: Unit tests
        run: npx jest --ci
      - name: Build
        run: npm run build

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Build (includes type-check)
        run: npm run build

  landing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Build (includes type-check)
        run: npm run build

  lint:
    # Informational until the existing findings are cleaned up (2026-10-28:
    # backend ~450, 250 of them prettier formatting; frontend 11 errors;
    # landing has no ESLint config). Drop continue-on-error then.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Backend lint (no --fix)
        working-directory: backend
        run: |
          npm ci --no-audit --no-fund
          npx eslint "{src,apps,libs,test}/**/*.ts"
      - name: Frontend lint
        if: always()
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run lint
