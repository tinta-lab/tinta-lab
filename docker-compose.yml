
# Docker's default json-file driver never rotates (Grafana alone writes
# ~1GB/year of noise). "local" is compressed and rotated; `docker logs`
# still works. Applies when a container is (re)created.
x-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    container_name: tinta-postgres
    logging: *default-logging
    restart: always
    environment:
      POSTGRES_DB: tinta_lab
      POSTGRES_USER: tinta
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      # Bound to loopback only — was "5432:5432" (binds 0.0.0.0, reachable
      # from the whole LAN with just the DB password as the only barrier).
      # The backend connects via DB_HOST=localhost anyway (it runs on this
      # same host outside Docker), so this doesn't change how the app
      # reaches it.
      - "127.0.0.1:5432:5432"

  # Redis was removed 2026-10-28: its only consumer, the JWT blacklist, was
  # replaced by session revocation in Postgres (sql/012_revoked_sessions.sql).
  # ./data/redis is kept for now, until a separate decision to delete it.

  adminer:
    # Pinned: was the bare "adminer" tag (:latest).
    image: adminer:5.4.2
    container_name: tinta-adminer
    logging: *default-logging
    restart: always
    environment:
      # Adminer's own default is "db", which doesn't resolve on this network.
      ADMINER_DEFAULT_SERVER: tinta-postgres
    ports:
      # Was "8080:8080" (0.0.0.0 — reachable on the public IPv6 address
      # too, not just the LAN). Tried 127.0.0.1 first, which was wrong:
      # db.tinta-lab.de is a real Cloudflare Access app ("Only Viktor"
      # policy) proxied through the tinta-lab-server tunnel running on a
      # SEPARATE host (ct200), which reaches this box over the LAN — a
      # loopback-only bind can't accept that connection at all, so it broke
      # the legitimate access path along with the unwanted one. Binding to
      # the LAN IP specifically removes the public-IPv6 exposure (the part
      # that actually mattered) while leaving the tunnel able to reach it.
      # Direct-LAN access is closed by a DOCKER-USER rule in
      # /etc/ufw/after.rules (Docker-published ports bypass UFW): only ct200
      # (192.168.2.200) may reach 8080 and Grafana's 3003.
      - "192.168.2.63:8080:8080"

  grafana:
    # Pinned: :latest meant whatever happened to be pulled last.
    image: grafana/grafana:13.0.0
    container_name: tinta-grafana
    logging: *default-logging
    restart: always
    environment:
      # Only applied when grafana.db is first created — changing it later
      # does NOT change the admin password (use `grafana cli admin
      # reset-admin-password` inside the container for that).
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://monitor.tinta-lab.de
      GF_INSTALL_PLUGINS: ""
      # Read-only Postgres role for the datasource (provisioning/datasources).
      GRAFANA_DB_USER: ${GRAFANA_DB_USER}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD}
    volumes:
      # Datasource + dashboard provisioning live in git (ops/grafana);
      # read-only, so Grafana can't change what's reviewed there.
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      # Was "3003:3000" (0.0.0.0 and [::] — the public IPv6 too), which
      # bypassed the Cloudflare Access app on monitor.tinta-lab.de. Same
      # reasoning as adminer above: the tunnel on ct200 reaches this box
      # over the LAN, so bind to the LAN IP, not loopback.
      - "192.168.2.63:3003:3000"
    depends_on:
      - postgres

volumes:
  grafana-data:

networks:
  default:
    name: tinta-network
