
services:
  postgres:
    image: postgres:16-alpine
    container_name: tinta-postgres
    restart: always
    environment:
      POSTGRES_DB: tinta_lab
      POSTGRES_USER: tinta
      POSTGRES_PASSWORD: TintaSecure2026!
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: tinta-redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - ./data/redis:/data
    ports:
      - "6379:6379"

  adminer:
    image: adminer
    container_name: tinta-adminer
    restart: always
    ports:
      - "8080:8080"

  grafana:
    image: grafana/grafana:latest
    container_name: tinta-grafana
    restart: always
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: TintaGrafana2026!
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://monitor.tinta-lab.de
      GF_INSTALL_PLUGINS: ""
    volumes:
      - ./data/grafana/provisioning:/etc/grafana/provisioning
      - ./data/grafana/dashboards:/var/lib/grafana/dashboards
      - grafana-data:/var/lib/grafana
    ports:
      - "3003:3000"
    depends_on:
      - postgres

volumes:
  grafana-data:

networks:
  default:
    name: tinta-network
