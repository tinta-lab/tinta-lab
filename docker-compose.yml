
services:
  postgres:
    image: postgres:16-alpine
    container_name: tinta-postgres
    restart: always
    environment:
      POSTGRES_DB: tinta_lab
      POSTGRES_USER: tinta
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      # Bound to loopback only — was "5432:5432" (binds 0.0.0.0, reachable
      # from the whole LAN with just the DB password as the only barrier).
      # The backend connects via REDIS_HOST/DB_HOST=localhost anyway (it
      # runs on this same host outside Docker), so this doesn't change how
      # the app reaches it.
      - "127.0.0.1:5432:5432"

  redis:
    image: redis:7-alpine
    container_name: tinta-redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - ./data/redis:/data
    ports:
      # Was "6379:6379" (0.0.0.0, no password) — this instance backs the
      # JWT revocation blacklist (token-blacklist.service.ts), so anyone on
      # the LAN could previously clear an entry and un-revoke a dead token.
      - "127.0.0.1:6379:6379"

  adminer:
    image: adminer
    container_name: tinta-adminer
    restart: always
    ports:
      # Was "8080:8080" (0.0.0.0 — reachable on the public IPv6 address
      # too, not just the LAN). Tried 127.0.0.1 first, which was wrong:
      # db.tinta-lab.de is a real Cloudflare Access app ("Only Viktor"
      # policy) proxied through the tinta-lab-server tunnel running on a
      # SEPARATE host (ct200), which reaches this box over the LAN — a
      # loopback-only bind can't accept that connection at all, so it broke
      # the legitimate access path along with the unwanted one. Binding to
      # the LAN IP specifically removes the public-IPv6 exposure (the part
      # that actually mattered) while leaving the tunnel able to reach it.
      # Direct-LAN access without going through Access is still technically
      # possible from this specific address — closing that fully needs a
      # host firewall rule scoped to ct200's IP, not a Docker port change.
      - "192.168.2.63:8080:8080"

  grafana:
    image: grafana/grafana:latest
    container_name: tinta-grafana
    restart: always
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://monitor.tinta-lab.de
      GF_INSTALL_PLUGINS: ""
    volumes:
      - ./data/grafana/provisioning:/etc/grafana/provisioning
      - ./data/grafana/dashboards:/var/lib/grafana/dashboards
      - grafana-data:/var/lib/grafana
    ports:
      - "3003:3000"
    depends_on:
      - postgres

volumes:
  grafana-data:

networks:
  default:
    name: tinta-network
